[platformio]
default_envs = photopainter

[env:photopainter]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; USB-CDC an: ohne serielle Ausgabe ist der Produktivbuild im Fehlerfall
  ; blind (Logs gingen sonst auf UART0). Erst wieder auf 0 stellen, wenn der
  ; Aufhaenger nach dem ersten Deep Sleep geklaert ist -- siehe README.
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<scan_main.cpp> -<epd_test.cpp> -<localtest.cpp> -<displaytest.cpp> -<wifitest.cpp>
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  bblanchon/ArduinoJson@^7.0.0
  adafruit/Adafruit SHTC3 Library@^1.0.1
  lewisxhe/XPowersLib@^0.2.6

[env:scan]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<scan_main.cpp>

[env:epdtest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<epd_test.cpp>
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9

[env:localtest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<localtest.cpp> +<local_sensors.cpp>
lib_deps =
  adafruit/Adafruit SHTC3 Library@^1.0.1
  lewisxhe/XPowersLib@^0.2.6

[env:displaytest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<displaytest.cpp> +<display_view.cpp> +<view_model.cpp> +<forecast.cpp> +<local_sensors.cpp>
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  bblanchon/ArduinoJson@^7.0.0
  adafruit/Adafruit SHTC3 Library@^1.0.1
  lewisxhe/XPowersLib@^0.2.6

[env:debug]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_SLEEP_S=30
build_src_filter = +<*> -<scan_main.cpp> -<epd_test.cpp> -<localtest.cpp> -<displaytest.cpp> -<wifitest.cpp>
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  bblanchon/ArduinoJson@^7.0.0
  adafruit/Adafruit SHTC3 Library@^1.0.1
  lewisxhe/XPowersLib@^0.2.6

[env:wifitest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<wifitest.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7.0.0
test_build_src = yes
build_src_filter = -<*> +<sb_sign.cpp> +<power_logic.cpp> +<view_model.cpp> +<switchbot_api.cpp> +<forecast.cpp>
